# ---------- Worker ----------
events {
  worker_connections 1024;
}

# ---------- HTTP ----------
http {
  # Upstreams trỏ TÊN SERVICE docker-compose
  upstream frontend {
    server frontend:3000;
  }

  upstream sanity_studio {
    server sanity-studio:3333;    # đổi thành: server cms:3333; nếu service tên 'cms'
  }

  # --- (1) Redirect HTTP -> HTTPS ---
  server {
    listen 80;
    server_name duetnightabyss.gachabuild.com;
    return 301 https://$host$request_uri;
  }

  # --- (2) Server HTTPS chính ---
  server {
    listen 443 ssl http2;
    server_name duetnightabyss.gachabuild.com;

    # Đường dẫn chứng chỉ (bên trong container) — volume đã mount /etc/letsencrypt
    ssl_certificate     /etc/letsencrypt/live/duetnightabyss.gachabuild.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duetnightabyss.gachabuild.com/privkey.pem;

    # Bảo mật & nén
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy - Allow Google Fonts, Google Analytics, and Sanity
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://*.sanity.io https://cdn.sanity.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.sanity.io; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.sanity.io wss://*.sanity.io; frame-src 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # --- Next.js app ---
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # (chủ yếu dùng dev; prod Next.js không cần)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 300s;
      proxy_cache_bypass $http_upgrade;
    }

    # --- Sanity Studio (DEV qua Vite) ---
    # LƯU Ý dấu "/" ở cả location và proxy_pass để strip prefix /studio -> /
    location /studio/ {
      proxy_pass http://sanity_studio/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket/HMR (rất quan trọng với Vite qua HTTPS)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
      proxy_cache_bypass $http_upgrade;
    }

    # --- Static Next.js cache ---
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, immutable";
    }

    # --- Healthcheck ---
    location /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }
  }
}
