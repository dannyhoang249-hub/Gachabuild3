# Production Docker Compose Configuration for GachaBuild3

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-u9m27k7u}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - gachabuild-network

  # Sanity Studio (Production - Static Build)
  sanity-studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
      args:
        - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-u9m27k7u}
        - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}
    ports:
      - "3333:3333"
    restart: unless-stopped
    networks:
      - gachabuild-network

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - sanity-studio
    restart: unless-stopped
    networks:
      - gachabuild-network

networks:
  gachabuild-network:
    driver: bridge