version: '3.8'

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-u9m27k7u}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Mount public assets for development
      - ./public:/app/public:ro
    restart: unless-stopped
    networks:
      - gachabuild-network

  # Sanity Studio (Development)
  sanity-studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    ports:
      - "3334:3333"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-u9m27k7u}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN}
      - HOST=0.0.0.0
      - VITE_HOST=0.0.0.0
    volumes:
      # Mount source code for hot reloading
      - ./sanity:/app/sanity
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
    command: npx sanity dev --host 0.0.0.0 --port 3333 --force
    restart: unless-stopped
    networks:
      - gachabuild-network

networks:
  gachabuild-network:
    driver: bridge
